name: Docs

# Every change to the docs is built; only a stable release publishes them, so the live docs
# describe the version people can run. Run it by hand on main to publish a docs fix early, or on
# a tag to publish that release again.
on:
  push:
    branches: [main]
    # GitHub doesn't apply `paths` to tag pushes, so every stable release deploys
    tags: ["v*", "!v*-*"]
    paths:
      - site/**
      - CHANGELOG.md
      - openapi.json
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - site/**
      - CHANGELOG.md
      - openapi.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@24
          cache: true
          save-cache: ${{ github.event_name != 'pull_request' }}
          working-directory: site
          require-lockfile: true
      - run: pnpm --dir site check
      # the build fails on a broken internal link
      - run: pnpm --dir site build
        env:
          # the header's star count; GitHub limits unauthenticated calls per runner address
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Build & deploy
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # holds the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets
    environment:
      name: docs
      url: https://docs.whatomato.habibium.com
    # one deploy at a time across refs, and none is cut short
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The docs environment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; site/README.md says how to make them"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@24
          cache: true
          working-directory: site
          require-lockfile: true
      - run: pnpm --dir site check
      - run: pnpm --dir site build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: pnpm
          command: deploy
