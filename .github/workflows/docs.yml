name: Docs

on:
  push:
    branches: [main]
    paths:
      - site/**
      - CHANGELOG.md
      - openapi.json
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - site/**
      - CHANGELOG.md
      - openapi.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # a deploy runs to its end; only a pull request's superseded build is dropped
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@24
          cache: true
          working-directory: site
          require-lockfile: true
      - run: pnpm --dir site check
      # the build fails on a broken internal link
      - run: pnpm --dir site build
        env:
          # the header's star count; GitHub limits unauthenticated calls per runner address
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Build & deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the site builds and the deploy skips
    environment: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@24
          cache: true
          working-directory: site
          require-lockfile: true
      - run: pnpm --dir site check
      - run: pnpm --dir site build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: pnpm
          command: deploy
