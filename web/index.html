<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whatomato</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Paints the blank page in the stored scheme before any CSS or JS loads.
      // Key must match STORAGE_KEY in src/lib/theme.ts.
      try {
        var pref = localStorage.getItem('wa-color-scheme')
        document.documentElement.style.colorScheme =
          pref === 'light' || pref === 'dark' ? pref : 'light dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
